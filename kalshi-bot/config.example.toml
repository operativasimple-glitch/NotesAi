# Copia este archivo como config.toml y ajústalo a tu gusto (o cámbialo desde el panel web).
# Los secretos (API key) van en .env o en el panel, nunca aquí.
# Los importes están en dólares y los precios entre 0 y 1 (0.45 = 45¢).
# Por qué estos valores: lee INVESTIGACION.md.

[bot]
poll_interval_seconds = 5        # segundos entre vueltas del bot (en partidos los precios se mueven rápido)
cancel_on_exit = true            # al detener el bot, cancelar sus órdenes
order_ttl_seconds = 600          # las órdenes en reposo caducan solas tras 10 min (por si el bot se cae); 0 = nunca
taker_cooldown_seconds = 30      # tras una orden IOC en un mercado, esperar antes de repetir
requote_tolerance = 0.0          # no mover una orden si el precio deseado cambió menos que esto
max_consecutive_errors = 10      # freno de emergencia tras N vueltas seguidas con errores
paper_cash = 1000                # saldo virtual para simular sin API key
order_prefix = "kb"              # el bot solo toca órdenes cuyo client_order_id empieza así (usa otro si corres varios bots)
log_dir = "logs"                 # aquí van bot.log y journal.jsonl

[markets]
# Por defecto, los partidos (quién gana): es donde la prueba con datos reales dio ventaja
# (+3,9 % tras comisiones en 878 partidos; ver INVESTIGACION.md).
series = ["KXMLBGAME", "KXNFLGAME", "KXNHLGAME", "KXNBAGAME", "KXNCAAFGAME"]
max_hours_to_close = 6           # solo partidos que terminan en las próximas 6 h (en juego o a punto de empezar)
min_hours_to_close = 0           # el riesgo deja de operar 15 min antes del final previsto
max_markets = 15                 # como mucho, los N de más volumen
max_markets_per_event = 1        # uno por evento: cada partido tiene dos mercados que son la misma apuesta
min_volume_24h = 1000            # volumen mínimo en las últimas 24 h (contratos)
exclude_series = []              # series a evitar
# Otra forma: buscar en TODOS los mercados que se deciden en las próximas N horas (0 = desactivado):
closing_within_hours = 0
# Además puedes fijar mercados concretos o eventos:
tickers = []
events = []
refresh_minutes = 5              # cada cuánto se vuelve a buscar mercados

[risk]
max_order_contracts = 10         # contratos por orden (con menos, el redondeo de la comisión pesa)
max_position_per_market = 20     # contratos por mercado (YES o NO)
max_total_exposure_dollars = 50  # dinero máximo comprometido: posiciones de la cuenta + órdenes del bot
max_session_loss_dollars = 20    # si pierdes esto desde que arrancó el bot: cancela todo y se detiene (0 = off)
min_price = 0.03                 # no operar por debajo de 3¢...
max_price = 0.97                 # ...ni por encima de 97¢
min_minutes_to_close = 15        # no operar en los últimos 15 min antes del cierre (o del final previsto del partido)

[http]
reads_per_second = 8             # por debajo de los límites del nivel Basic de Kalshi
writes_per_second = 4
timeout_seconds = 10
self_trade_prevention = "taker_at_cross"

[strategy]
# "favorites"    compra el lado favorito (88–97¢) como maker  ← la que respalda la investigación
# "fair_value"   opera contra TUS probabilidades (fair_values.csv)
# "market_maker" cotiza a ambos lados (plantilla educativa)
# o tu propia estrategia como "mi_modulo:MiClase".
name = "favorites"

[strategy.params]
min_price = 0.88                 # precio mínimo del favorito
max_price = 0.97                 # precio máximo a pagar
order_size = 10                  # contratos por orden
max_position = 20                # contratos máximos por mercado
max_spread = 0.04                # ignorar mercados con más de 4¢ de spread
improve = true                   # mejorar en un tick la mejor oferta (sin cruzar)

# ---------------------------------------------------------------------------
# Valor justo: sustituye [strategy] y [strategy.params] por
#
# [strategy]
# name = "fair_value"
#
# [strategy.params]
# mode = "taker"              # "taker" (IOC cuando hay ventaja) o "maker" (deja órdenes)
# min_edge = 0.04             # ventaja mínima por contrato tras comisiones (4¢)
# order_size = 2
# max_position = 10
# fair_values_file = "fair_values.csv"   # se recarga solo cuando lo editas
#
# Creador de mercado:
#
# [strategy]
# name = "market_maker"
#
# [strategy.params]
# half_spread = 0.02          # cotiza a 2¢ del precio medio por cada lado
# quote_size = 2
# max_position = 10
# skew_per_contract = 0.002   # desplaza las cotizaciones 0.2¢ por contrato de inventario
# min_book_spread = 0.03      # solo cotiza si el spread del mercado es de 3¢ o más
