<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Radar Ballena</title>
<meta name="description" content="Sigue a las ballenas cripto, las liquidaciones y el sentimiento del mercado. Gratis.">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --bg:#0b0f14; --bg2:#121820; --bg3:#1a222c; --line:#25303c;
  --tx:#e6edf5; --tx2:#8d9aab; --acc:#2dd4bf; --acc2:#0f766e;
  --up:#22c55e; --dn:#ef4444; --gold:#f5c045; --orange:#f59e0b;
  --r:14px; --tabh:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.hidden{display:none !important}
.up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--tx2)} .acc{color:var(--acc)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:12.5px} .tiny{font-size:11px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* layout */
.topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(11,15,20,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;margin:0;font-size:18px;letter-spacing:-.2px}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--dn)}
.live.on i{background:var(--up);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.iconbtn{background:none;border:0;padding:6px;border-radius:10px;color:var(--tx2);display:flex}
.iconbtn:active{background:var(--bg3)}
main{padding:calc(58px + env(safe-area-inset-top)) 14px calc(var(--tabh) + 24px + env(safe-area-inset-bottom));
  max-width:720px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:rgba(18,24,32,.96);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;height:var(--tabh);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--tx2);font-size:10.5px;position:relative}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--acc)}
.badge{position:absolute;top:7px;left:calc(50% + 6px);background:var(--dn);color:#fff;border-radius:9px;
  font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px}

/* cards */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.card h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h2 .more{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--acc);background:none;border:0;padding:0}
.hint{font-size:12.5px;color:var(--tx2);margin:6px 0 0}
.empty{color:var(--tx2);font-size:13.5px;text-align:center;padding:18px 6px}
.seg{display:flex;background:var(--bg3);border-radius:11px;padding:3px;margin:12px 0 4px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;color:var(--tx2);font-weight:600;font-size:13.5px}
.seg button.on{background:var(--bg2);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg2);color:var(--tx2);border-radius:999px;
  padding:5px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--acc2);border-color:var(--acc);color:#e6fffb}
.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--acc);color:#04201c;font-weight:700}
.btn.sec{background:var(--bg3);color:var(--tx);border:1px solid var(--line)}
.btn.danger{background:#3a1416;color:#ffb4b4;border:1px solid #5b1d20}
.btn:disabled{opacity:.5}
input.txt,select.txt,textarea.txt{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input.txt:focus,textarea.txt:focus{border-color:var(--acc)}
label.lab{display:block;font-size:12.5px;color:var(--tx2);margin:12px 0 5px}

/* thermometer */
.gauge{display:flex;flex-direction:column;align-items:center}
.gauge svg{width:100%;max-width:280px;height:auto}
.gscore{font-size:38px;font-weight:800;margin-top:-2px;line-height:1.1;letter-spacing:-1px}
.glabel{font-weight:700;font-size:15px;margin-top:-2px}
.sig{display:grid;grid-template-columns:minmax(0,1fr) 44px auto;gap:7px 10px;align-items:center;margin-top:14px;font-size:13px}
.sig .bar{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden}
.sig .bar i{display:block;height:100%;border-radius:3px}
.sig .v{text-align:right;color:var(--tx2);font-size:12px;white-space:nowrap}

/* tickers */
.tick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tick{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;width:100%}
.tick .c{font-weight:800;font-size:14px}
.tick .p{font-size:16px;font-weight:700;margin-top:2px}
.tick .s{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx2);margin-top:2px}
.spark{width:100%;height:28px;display:block;margin-top:4px}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.list .item:first-child{border-top:0}
.tag{flex:none;font-size:11px;font-weight:800;border-radius:6px;padding:3px 6px;letter-spacing:.3px}
.tag.buy{background:rgba(34,197,94,.15);color:var(--up)}
.tag.sell{background:rgba(239,68,68,.15);color:var(--dn)}
.tag.big{background:rgba(245,192,69,.16);color:var(--gold)}
.amt{font-weight:800;font-size:15px}
.who{font-size:12px;color:var(--tx2)}
.when{font-size:11.5px;color:var(--tx2);text-align:right;flex:none}

/* balance bars */
.lsbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bg3);margin:6px 0}
.lsbar i{display:block;height:100%}
.lsbar .l{background:var(--up)} .lsbar .s{background:var(--dn)}
.lsrow{margin:10px 0}
.lsrow .row{font-size:13px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg3);border-radius:10px;padding:9px 10px}
.stat .k{font-size:11.5px;color:var(--tx2)}
.stat .v{font-weight:700;font-size:15px;margin-top:1px}

/* positions */
.pos{border-top:1px solid var(--line);padding:10px 0;font-size:13px}
.pos:first-child{border-top:0}
.pos .top{display:flex;align-items:center;gap:8px}
.pos .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px;color:var(--tx2);font-size:12px}
.pos .grid b{display:block;color:var(--tx);font-weight:600;font-size:12.5px}

/* liquidation map */
.lmap{margin-top:8px;font-size:11px}
.lrow{display:grid;grid-template-columns:1fr 70px;align-items:center;height:15px;gap:6px}
.lrow .b{position:relative;height:11px}
.lrow .b i{position:absolute;left:0;top:0;height:100%;border-radius:0 3px 3px 0;opacity:.85}
.lrow .b em{position:absolute;left:0;top:3px;height:5px;border-radius:0 3px 3px 0;background:var(--gold)}
.lrow .px{text-align:right;color:var(--tx2)}
.lrow.now{height:22px}
.lrow.now .b{height:2px;background:var(--acc)}
.lrow.now .px{color:var(--acc);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* chart */
.chart{position:relative;margin-top:8px}
.chart svg{width:100%;height:170px;display:block}
.chart .hi,.chart .lo{position:absolute;right:0;font-size:11px;color:var(--tx2);background:var(--bg2);padding:0 3px}
.chart .hi{top:0} .chart .lo{bottom:0}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14.5px}
.msg p{margin:0 0 6px} .msg p:last-child{margin:0}
.msg ul{margin:4px 0 6px;padding-left:20px}
.msg .mdh{font-weight:800}
.msg.user{align-self:flex-end;background:var(--acc2);color:#e6fffb;border-bottom-right-radius:4px}
.msg.model{align-self:flex-start;background:var(--bg2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.error{align-self:center;background:#3a1416;color:#ffb4b4;font-size:13px}
.msg.typing{color:var(--tx2)}
.ask{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:4;
  background:rgba(11,15,20,.95);border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px}
.ask textarea{flex:1;resize:none;height:42px;max-height:120px}
.ask .btn{padding:0 16px}
.ai-pad{height:70px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--bg);width:100%;max-width:720px;max-height:92vh;border-radius:18px 18px 0 0;
  border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.sheet-head h2{flex:1;margin:0;font-size:17px;min-width:0}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(24px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));
  background:#e6edf5;color:#0b0f14;padding:9px 14px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:30;
  max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:opacity .25s}
.foot{font-size:11.5px;color:var(--tx2);text-align:center;margin:18px 6px 0}
.cardcfg{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.cardcfg:first-child{border-top:0}
.cardcfg button{background:var(--bg3);border:1px solid var(--line);border-radius:8px;width:34px;height:30px}
</style>
</head>
<body>

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const short = a => a ? a.slice(0, 6) + '…' + a.slice(-4) : '';
const isAddr = a => /^0x[0-9a-fA-F]{40}$/.test(a);
const nfCache = {};
const nf = (d, opt) => {
  const k = d + JSON.stringify(opt || {});
  return nfCache[k] || (nfCache[k] = new Intl.NumberFormat('es-ES', Object.assign({ minimumFractionDigits: d, maximumFractionDigits: d }, opt || {})));
};
const nfMax = d => nfCache['m' + d] || (nfCache['m' + d] = new Intl.NumberFormat('es-ES', { maximumFractionDigits: d }));
function pxDec(p) { p = Math.abs(p); return p >= 1000 ? 0 : p >= 100 ? 1 : p >= 1 ? 2 : p >= 0.01 ? 4 : 6; }
function fmtPx(p) { return p == null || isNaN(p) ? '—' : nf(pxDec(p)).format(p); }
function usd(v) {
  if (v == null || isNaN(v)) return '—';
  const s = v < 0 ? '−' : '';
  v = Math.abs(v);
  let t;
  if (v < 1e3) t = nf(0).format(v);
  else if (v < 1e6) t = nfMax(v < 1e4 ? 1 : 0).format(v / 1e3) + ' mil';
  else if (v < 1e9) t = nfMax(v < 1e8 ? 1 : 0).format(v / 1e6) + ' M';
  else t = nfMax(2).format(v / 1e9) + ' mil M';
  return s + '$' + t;
}
function pct(f, d = 2) { if (f == null || isNaN(f)) return '—'; return (f > 0 ? '+' : f < 0 ? '−' : '') + nf(d).format(Math.abs(f * 100)) + '%'; }
function cls(v) { return v > 0 ? 'up' : v < 0 ? 'dn' : 'mut'; }
function ago(t) {
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 60) return 'hace ' + s + ' s';
  if (s < 3600) return 'hace ' + Math.floor(s / 60) + ' min';
  if (s < 86400) return 'hace ' + Math.floor(s / 3600) + ' h';
  return 'hace ' + Math.floor(s / 86400) + ' d';
}
function hhmm(t) { return new Date(t).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }

async function hl(body) {

async function okx(path) {

async function pool(items, n, fn) {

  await Promise.all(Array.from({ length: Math.min(n, items.length) }, run));
}

const candleCache = {};
async function candles(coin, interval, span) {
  const k = coin + '|' + interval + '|' + span;
  const c = candleCache[k];
  if (c && Date.now() - c.t < 4 * 60e3) return c.d;
  const end = Date.now();
  const d = await hl({ type: 'candleSnapshot', req: { coin, interval, startTime: end - span, endTime: end } });
  const out = (d || []).map(x => ({ t: x.t, o: +x.o, h: +x.h, l: +x.l, c: +x.c, v: +x.v }));
  candleCache[k] = { t: Date.now(), d: out };
  return out;
}

const ctVal = {};
async function loadLiqs() {
  let added = 0;
  for (const c of CFG.coins) {
    try {
      if (ctVal[c] === undefined) {
        const d = await okx('/public/instruments?instType=SWAP&instFamily=' + c + '-USDT');
        const it = d.find(x => x.instId === c + '-USDT-SWAP');
        ctVal[c] = it ? (+it.ctVal) * (+it.ctMult || 1) : 0;
      }
      if (!ctVal[c]) continue;
      const d = await okx('/public/liquidation-orders?instType=SWAP&instFamily=' + c + '-USDT&state=filled&limit=100');
      for (const blk of d) {
        for (const x of blk.details || []) {
          const id = c + x.ts + x.sz + x.bkPx;
          if (liqSeen.has(id)) continue;
          liqSeen.add(id);
          const long = x.posSide === 'long' || (x.posSide === 'net' && x.side === 'sell');
          const px = +x.bkPx;
          ST.liqs.push({ id, coin: c, long, usd: (+x.sz) * ctVal[c] * px, px, ts: +x.ts });
          added++;
        }
      }
    } catch (e) {}
  }
  const cut = Date.now() - 26 * 3600e3;
  ST.liqs = ST.liqs.filter(l => l.ts > cut).sort((a, b) => b.ts - a.ts).slice(0, 5000);

async function loadSaved() {

    const old = ST.savedPos[s.addr];
    if (old) diffPositions(s, old, now);
    ST.savedPos[s.addr] = now;
  }
  LS.set('rb_savedpos', ST.savedPos);
}
function diffPositions(s, old, now) {
  const coins = new Set(Object.keys(old).concat(Object.keys(now)));
  const ev = [];
  coins.forEach(c => {
    const o = old[c] || 0, n = now[c] || 0;
    const px = (ST.ctx[c] || {}).px || 0;
    const side = v => v > 0 ? 'LARGO' : 'CORTO';
    let txt = null;
    if (!o && n) txt = 'abre ' + side(n) + ' en ' + c + ' (' + usd(Math.abs(n) * px) + ')';
    else if (o && !n) txt = 'cierra su ' + side(o) + ' en ' + c + ' (' + usd(Math.abs(o) * px) + ')';
    else if (o && n && Math.sign(o) !== Math.sign(n)) txt = 'gira a ' + side(n) + ' en ' + c + ' (' + usd(Math.abs(n) * px) + ')';
    else if (o && n && Math.abs(n) > Math.abs(o) * 1.1) txt = 'aumenta su ' + side(n) + ' en ' + c + ' a ' + usd(Math.abs(n) * px);
    else if (o && n && Math.abs(n) < Math.abs(o) * 0.9) txt = 'reduce su ' + side(n) + ' en ' + c + ' a ' + usd(Math.abs(n) * px);
    if (txt) ev.push([s.label + ' ' + txt, n > o ? 'buy' : 'sell']);
  });
  // muchos cambios a la vez: se guardan todos pero solo sale un aviso
  ev.forEach((e, i) => addAlert(s.addr, e[0], e[1], ev.length > 2 && i > 0));
  if (ev.length > 2) toast('🐋 ' + s.label + ': ' + ev.length + ' cambios de posición');
}
function addAlert(addr, text, kind, quiet) {
  ST.alerts.unshift({ addr, text, kind, t: Date.now() });
  ST.alerts = ST.alerts.slice(0, 100);
  if (ST.tab !== 'wallets') ST.unread++;
  LS.set('rb_alerts', ST.alerts);
  LS.set('rb_unread', ST.unread);
  updBadge();
  if (quiet) return;
  toast('🐋 ' + text);
  try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
  try {
    if (document.hidden && 'Notification' in window && Notification.permission === 'granted') new Notification('Radar Ballena', { body: text, icon: 'icon-192.png' });
  } catch (e) {}
  updBadge();
}

/* ---------- operaciones en directo (websocket de Hyperliquid) ---------- */
let ws = null, wsPing = null, wsTimer = null;
function wsConnect() {
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  try { ws = new WebSocket(HL_WS); } catch (e) { wsLater(); return; }
  const me = ws;
  me.onopen = () => {
    ST.wsOk = true; setLive();
    CFG.coins.forEach(c => me.send(JSON.stringify({ method: 'subscribe', subscription: { type: 'trades', coin: c } })));
    clearInterval(wsPing);
    wsPing = setInterval(() => { try { me.send('{"method":"ping"}'); } catch (e) {} }, 30000);
  };
  me.onmessage = e => {
    let m;
    try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.channel === 'trades' && Array.isArray(m.data)) onTrades(m.data);
  };
  me.onclose = () => {
    if (ws !== me) return;
    ST.wsOk = false; setLive(); clearInterval(wsPing); wsLater();
  };
  me.onerror = () => { try { me.close(); } catch (e) {} };
}
function wsLater() {
  if (wsTimer) return;
  wsTimer = setTimeout(() => { wsTimer = null; if (!document.hidden) wsConnect(); }, 4000);
}
function wsRestart() {
  const old = ws; ws = null;
  if (old) { try { old.close(); } catch (e) {} }
  ST.wsOk = false; setLive(); wsConnect();
}

// las órdenes grandes llegan troceadas en varios "fills": las juntamos por orden
const pend = new Map();
function onTrades(arr) {
  for (const t of arr) {
    const px = +t.px, sz = +t.sz;
    const taker = Array.isArray(t.users) ? (t.side === 'B' ? t.users[0] : t.users[1]) : '';
    const zero = !t.hash || /^0x0+$/.test(t.hash);
    const key = t.coin + '|' + (zero ? taker + '|' + t.time : t.hash);
    let g = pend.get(key);
    if (!g) {
      g = { id: key, coin: t.coin, side: t.side === 'B' ? 'buy' : 'sell', usd: 0, sz: 0, time: t.time, user: taker };
      pend.set(key, g);
      setTimeout(() => flushTrade(key), 1500);
    }
    g.usd += px * sz;
    g.sz += sz;
  }
}
function flushTrade(key) {
  const g = pend.get(key);
  pend.delete(key);
  if (!g || g.usd < CFG.min || tradeSeen.has(g.id)) return;
  tradeSeen.add(g.id);
  g.px = g.usd / g.sz;
  ST.whaleTrades.unshift(g);
  if (ST.whaleTrades.length > 400) ST.whaleTrades.length = 400;
  saveSoon('rb_wt', () => ST.whaleTrades);
  if (isSaved(g.user)) addAlert(g.user, labelOf(g.user) + (g.side === 'buy' ? ' compra ' : ' vende ') + usd(g.usd) + ' de ' + g.coin, g.side);
  dirty();
}

/* ---------- termómetro del mercado: 8 señales en una ---------- */
function thermo() {
  const P = [];
  const add = (k, s, txt, help) => { if (s != null && !isNaN(s)) P.push({ k, s: clamp(s), txt, help }); };
  if (ST.fng) add('Miedo y codicia', ST.fng.value, ST.fng.value + ' · ' + fngLabel(ST.fng.value), 'Índice clásico de sentimiento (alternative.me).');
  const b = ST.ctx.BTC;
  if (b) add('Precio BTC 24 h', 50 + b.chg * 500, pct(b.chg), 'Subidas fuertes = euforia; caídas = miedo.');
  const fs = ['BTC', 'ETH', 'SOL'].map(c => ST.ctx[c] && ST.ctx[c].fund).filter(x => x != null);
  if (fs.length) {
    const ann = fs.reduce((a, x) => a + x, 0) / fs.length * 24 * 365;
    add('Financiación (funding)', 50 + (ann - 0.05) * 150, pct(ann, 1) + ' anual', 'Positiva y alta = los largos pagan por estar dentro (codicia).');
  }
  if (ST.ls.BTC) {
    const r = ST.ls.BTC;
    add('Largos vs cortos', 50 + (r.cur / r.avg - 1) * 400, nf(2).format(r.cur) + ' (media ' + nf(2).format(r.avg) + ')', 'Cuentas en largo por cada cuenta en corto (Gate.io), comparado con su media de 24 h.');
  }
  const h1 = Date.now() - 3600e3;
  let ll = 0, sl = 0;
  ST.liqs.forEach(l => { if (l.ts > h1) { if (l.long) ll += l.usd; else sl += l.usd; } });
  if (ll + sl > 0) add('Liquidaciones 1 h', 100 * sl / (ll + sl), 'L ' + usd(ll) + ' · C ' + usd(sl), 'Si se liquidan más cortos que largos, el precio está apretando hacia arriba.');
  let bv = 0, sv = 0;
  ST.whaleTrades.forEach(t => { if (t.time > h1) { if (t.side === 'buy') bv += t.usd; else sv += t.usd; } });
  if (bv + sv > 0) add('Flujo de ballenas 1 h', 100 * bv / (bv + sv), 'C ' + usd(bv) + ' · V ' + usd(sv), 'Compras frente a ventas de las órdenes grandes en directo.');
  if (ST.oi.BTC) add('Interés abierto BTC', 50 + ST.oi.BTC.chg * 500, pct(ST.oi.BTC.chg) + ' ' + ST.oi.BTC.hours + ' h', 'Más contratos abiertos = más apalancamiento y apetito de riesgo.');
  if (ST.book.BTC) {
    const k = ST.book.BTC, r = k.bid / ((k.bid + k.ask) || 1);
    add('Libro de órdenes BTC', 50 + (r - 0.5) * 150, nf(0).format(r * 100) + '% compra', 'Peso de las órdenes de compra frente a las de venta cerca del precio.');
  }
  const score = P.length ? Math.round(P.reduce((a, p) => a + p.s, 0) / P.length) : null;
  return { score, label: score == null ? 'Cargando…' : thermoLabel(score), parts: P };
}
function thermoLabel(s) { return s < 20 ? 'Pánico' : s < 40 ? 'Miedo' : s < 60 ? 'Neutral' : s < 80 ? 'Codicia' : 'Euforia'; }
function fngLabel(v) { return v < 25 ? 'Miedo extremo' : v < 45 ? 'Miedo' : v <= 55 ? 'Neutral' : v <= 75 ? 'Codicia' : 'Codicia extrema'; }
function scoreColor(s) { return s < 20 ? '#ef4444' : s < 40 ? '#f59e0b' : s < 60 ? '#8d9aab' : s < 80 ? '#84cc16' : '#22c55e'; }

/* ---------- gráficos SVG ---------- */
function spark(vals, color) {
  if (!vals || vals.length < 2) return '<div class="spark"></div>';
  const w = 100, h = 28, mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), r = (mx - mn) || 1;
  const pts = vals.map((v, i) => (i / (vals.length - 1) * w).toFixed(2) + ',' + (h - 1 - (v - mn) / r * (h - 2)).toFixed(2)).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none"><polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>';
}
function gauge(score) {
  const cx = 100, cy = 100, r = 80;
  const pt = (a, rr) => [cx + rr * Math.cos(a * Math.PI / 180), cy - rr * Math.sin(a * Math.PI / 180)];
  const seg = (a0, a1, col) => {
    const [x0, y0] = pt(a0 - 1, r), [x1, y1] = pt(a1 + 1, r);
    return '<path d="M' + x0.toFixed(1) + ' ' + y0.toFixed(1) + ' A' + r + ' ' + r + ' 0 0 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + '" stroke="' + col + '" stroke-width="14" fill="none" stroke-linecap="butt"/>';
  };
  let s = '<svg viewBox="0 0 200 112">' + seg(180, 144, '#ef4444') + seg(144, 108, '#f59e0b') + seg(108, 72, '#5b6675') + seg(72, 36, '#84cc16') + seg(36, 0, '#22c55e');
  if (score != null) {
    const [x, y] = pt(180 - score * 1.8, r - 20);
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#e6edf5" stroke-width="3" stroke-linecap="round"/><circle cx="' + cx + '" cy="' + cy + '" r="5" fill="#e6edf5"/>';
  }
  return s + '</svg>';
}
function areaChart(c, color) {
  if (!c || c.length < 2) return '<div class="empty">Sin datos de precio</div>';
  const w = 300, h = 170, vals = c.map(x => x.c);
  const mn = Math.min.apply(null, c.map(x => x.l)), mx = Math.max.apply(null, c.map(x => x.h)), r = (mx - mn) || 1;
  const X = i => (i / (vals.length - 1) * w).toFixed(2), Y = v => (h - 4 - (v - mn) / r * (h - 8)).toFixed(2);
  const line = vals.map((v, i) => X(i) + ',' + Y(v)).join(' ');
  return '<div class="chart"><svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity=".35"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
    '<polygon points="0,' + h + ' ' + line + ' ' + w + ',' + h + '" fill="url(#ga)"/>' +
    '<polyline points="' + line + '" fill="none" stroke="' + color + '" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>' +
    '<span class="hi num">' + fmtPx(mx) + '</span><span class="lo num">' + fmtPx(mn) + '</span></div>';
}

function lsBar(long, shortV, labels) {

function whaleBias(coin) {
  let l = 0, s = 0, n = 0;
  Object.keys(ST.whales).forEach(a => {
    (ST.whales[a].pos || []).forEach(p => {
      if (p.coin !== coin) return;
      n++;
      if (p.szi > 0) l += p.usd; else s += p.usd;

  });

function liqTotals(win, coin) {
  const cut = Date.now() - win;
  let l = 0, s = 0, n = 0;
  ST.liqs.forEach(x => {
    if (x.ts <= cut || (coin && x.coin !== coin)) return;
    n++;

  });
  return { l, s, n };
}

// Mapa estimado: a partir del volumen de los últimos 7 días y apalancamientos típicos se calcula dónde
// se liquidarían las posiciones que siguen vivas. Encima, las liquidaciones reales de las ballenas.
const LEVS = [[5, 0.12], [10, 0.28], [25, 0.3], [50, 0.18], [100, 0.12]];
let mapSeq = 0;
async function drawLiqMap() {
  const seq = ++mapSeq, coin = ST.ui.liqCoin, range = ST.ui.liqRange;
  let c;
  try { c = await candles(coin, '1h', 7 * 24 * 3600e3); } catch (e) { c = null; }
  const box = $('liqmap');
  if (seq !== mapSeq || !box) return;
  const px = (ST.ctx[coin] || {}).px || (c && c.length ? c[c.length - 1].c : 0);
  if (!c || !c.length || !px) { box.innerHTML = '<div class="empty">No se pudo cargar el historial de ' + coin + '.</div>'; return; }
  const N = 44, lo = px * (1 - range), hi = px * (1 + range), step = (hi - lo) / N;
  const L = new Array(N).fill(0), S = new Array(N).fill(0), WL = new Array(N).fill(0), WS = new Array(N).fill(0);
  const bucket = p => p < lo || p >= hi ? -1 : Math.floor((p - lo) / step);
  const sufMin = new Array(c.length + 1), sufMax = new Array(c.length + 1);
  sufMin[c.length] = px; sufMax[c.length] = px;
  for (let i = c.length - 1; i >= 0; i--) { sufMin[i] = Math.min(sufMin[i + 1], c[i].l); sufMax[i] = Math.max(sufMax[i + 1], c[i].h); }
  for (let i = 0; i < c.length; i++) {
    const k = c[i], p = (k.h + k.l + k.c) / 3, vol = k.v * p;
    for (const [lev, w] of LEVS) {
      const ll = p * (1 - 1 / lev + 0.005), sl = p * (1 + 1 / lev - 0.005);
      if (ll < sufMin[i + 1]) { const b = bucket(ll); if (b >= 0) L[b] += vol * w; }
      if (sl > sufMax[i + 1]) { const b = bucket(sl); if (b >= 0) S[b] += vol * w; }
    }
  }
  let wl = 0, wsum = 0;
  Object.keys(ST.whales).forEach(a => (ST.whales[a].pos || []).forEach(p => {
    if (p.coin !== coin || !p.liq) return;
    const b = bucket(p.liq);
    if (b < 0) return;
    if (p.szi > 0) { WL[b] += p.usd; wl += p.usd; } else { WS[b] += p.usd; wsum += p.usd; }
  }));
  const mx = Math.max.apply(null, L.concat(S)) || 1, wmx = Math.max.apply(null, WL.concat(WS)) || 1;
  const nowB = bucket(px);
  let rows = '';
  for (let i = N - 1; i >= 0; i--) {
    const mid = lo + step * (i + 0.5), isLong = i < nowB;
    const v = isLong ? L[i] : S[i], wv = isLong ? WL[i] : WS[i];
    if (i === nowB) { rows += '<div class="lrow now"><div class="b"></div><div class="px num">' + fmtPx(px) + '</div></div>'; continue; }
    rows += '<div class="lrow"><div class="b"><i style="width:' + (v / mx * 100).toFixed(1) + '%;background:' + (isLong ? 'var(--up)' : 'var(--dn)') + '"></i>' +
      (wv ? '<em style="width:' + Math.max(4, wv / wmx * 100).toFixed(1) + '%"></em>' : '') + '</div><div class="px num">' + fmtPx(mid) + '</div></div>';
  }
  let bl = -1, bs = -1;
  for (let i = 0; i < N; i++) { if (i < nowB && (bl < 0 || L[i] > L[bl])) bl = i; if (i > nowB && (bs < 0 || S[i] > S[bs])) bs = i; }
  const mp = i => lo + step * (i + 0.5);

function md(s) {
  const inl = x => x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  let out = '', list = false;
  esc(s).split('\n').forEach(l => {
    const m = l.match(/^\s*[-*•]\s+(.*)/);
    if (m) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + inl(m[1]) + '</li>'; return; }
    if (list) { out += '</ul>'; list = false; }
    const hd = l.match(/^#{1,4}\s+(.*)/);
    if (hd) out += '<p class="mdh">' + inl(hd[1]) + '</p>';
    else if (l.trim()) out += '<p>' + inl(l) + '</p>';
  });
  return out + (list ? '</ul>' : '');
}

async function gemini(contents) {
  const key = CFG.key;
  let model = CFG.model;
  const body = { systemInstruction: { parts: [{ text: SYS }] }, contents, generationConfig: { temperature: 0.4 } };
  const waits = [3000, 9000];
  for (let i = 0; i <= waits.length; i++) {
    let r;
    try {
      r = await fetch(GEM + '/models/' + encodeURIComponent(model) + ':generateContent', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-goog-api-key': key }, body: JSON.stringify(body) });
    } catch (e) { throw new Error('Sin conexión con Google. Revisa el wifi o los datos.'); }
    if ((r.status === 429 || r.status === 503 || r.status === 500) && i < waits.length) { await sleep(waits[i]); continue; }
    if (r.status === 429) throw new Error('Has llegado al límite gratuito de Gemini por ahora. Espera un minuto y vuelve a preguntar.');
    if (r.status === 404 && model !== 'gemini-2.5-flash') { model = 'gemini-2.5-flash'; CFG.model = model; i--; continue; }
    if (!r.ok) {
      let msg = 'Error ' + r.status;
      try { const j = await r.json(); if (j.error && j.error.message) msg = j.error.message; } catch (e) {}
      if (/API key|credential|permission/i.test(msg)) msg = 'La clave de Gemini no vale. Revísala en Ajustes.';
      throw new Error(msg);
    }
    const j = await r.json();
    const cand = j.candidates && j.candidates[0];
    const txt = cand && cand.content ? (cand.content.parts || []).map(p => p.text || '').join('').trim() : '';
    if (!txt) throw new Error('Google no devolvió respuesta. Prueba a reformular la pregunta.');
    return txt;
  }
  throw new Error('Google está saturado. Inténtalo en un rato.');
}
async function ask(q) {
  q = (q || '').trim();
  if (!q || ST.aiBusy) return;
  if (!CFG.key) { toast('Primero pon tu clave gratuita de Gemini.'); return; }
  const prev = [];
  ST.chat.filter(m => m.role !== 'error').slice(-12).forEach(m => {
    const role = m.role === 'user' ? 'user' : 'model';
    if (prev.length && prev[prev.length - 1].role === role) prev[prev.length - 1].parts[0].text += '\n\n' + m.text;
    else prev.push({ role, parts: [{ text: m.text }] });
  });
  if (prev.length && prev[0].role === 'model') prev.shift();
  if (prev.length && prev[prev.length - 1].role === 'user') prev.pop();
  ST.chat.push({ role: 'user', text: q });
  ST.aiBusy = true;
  $('askin').value = '';
  renderAI(); scrollEnd();
  try {
    const txt = await gemini(prev.concat([{ role: 'user', parts: [{ text: 'DATOS EN DIRECTO (JSON):\n' + JSON.stringify(snapshot()) + '\n\nPREGUNTA: ' + q }] }]));
    ST.chat.push({ role: 'model', text: txt });
  } catch (e) {
    ST.chat.push({ role: 'error', text: e.message });
  }
  ST.aiBusy = false;
  ST.chat = ST.chat.slice(-40);
  LS.set('rb_chat', ST.chat);
  if (ST.tab === 'ai') { renderAI(); scrollEnd(); }
}

    '<label class="lab">Tarjetas del inicio</label><div class="card" style="margin:0;padding:6px 12px">' + cards.map((c, i) =>
      '<div class="cardcfg"><input type="checkbox" ' + (c.on ? 'checked' : '') + ' data-act="cardOn" data-v="' + i + '"><span class="grow small">' + CARDS[c.id] + '</span>' +
      '<button data-act="cardMove" data-v="' + i + '" data-d="-1" ' + (i === 0 ? 'disabled' : '') + '>↑</button><button data-act="cardMove" data-v="' + i + '" data-d="1" ' + (i === cards.length - 1 ? 'disabled' : '') + '>↓</button></div>').join('') + '</div>' +
    '<label class="lab">Clave de Google Gemini (para el asistente, gratis)</label><input class="txt" id="setKey" type="password" value="' + esc(CFG.key) + '" placeholder="AIza…" autocomplete="off">' +
    '<label class="lab">Modelo de Gemini</label><input class="txt" id="setModel" value="' + esc(CFG.model) + '" autocapitalize="off" spellcheck="false">' +
    '<div class="row" style="margin-top:10px"><button class="btn" data-act="saveSettings">Guardar</button><button class="btn sec" data-act="testKey">Probar clave</button></div>' +
    '<p class="hint">Consigue la clave gratis en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Se guarda solo en este móvil.</p>' +
    '<label class="lab">Datos</label><button class="btn danger" data-act="wipe">Borrar historial guardado</button>' +
    '<p class="hint">Radar Ballena es gratis y no tiene servidor: todo funciona en tu móvil con datos públicos de Hyperliquid, OKX, Gate.io y alternative.me. ' +
    'Las ballenas se ven en Hyperliquid porque allí todas las carteras son públicas. Nada de esto es consejo financiero.</p>');
}

/* ---------- hoja inferior, toast, insignias ---------- */
let sheetToken = 0;
function openSheet(title, html) {
  sheetToken++;
  $('sheetTitle').innerHTML = title;
  $('sheetBody').innerHTML = html;
  $('sheetBody').scrollTop = 0;
  $('sheet').classList.remove('hidden');
}
function closeSheet() { sheetToken++; $('sheet').classList.add('hidden'); dirty(); }
let toastT = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  t.style.opacity = '1';
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.classList.add('hidden'), 300); }, 3200);
}
function updBadge() {
  const b = $('alertBadge');
  b.textContent = ST.unread > 9 ? '9+' : ST.unread;
  b.classList.toggle('hidden', !ST.unread);
}
function setLive() {
  const l = $('live');
  l.classList.toggle('on', ST.wsOk);
  l.lastChild.textContent = ST.wsOk ? 'En directo' : 'Conectando';
}

/* ---------- navegación y repintado ---------- */
const RENDER = { home: renderHome, whales: renderWhales, liq: renderLiq, wallets: renderWallets, ai: renderAI };
function setTab(t) {
  ST.tab = t;
  Object.keys(RENDER).forEach(k => $('tab-' + k).classList.toggle('hidden', k !== t));
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('askbar').classList.toggle('hidden', t !== 'ai');
  if (t === 'wallets') { ST.unread = 0; LS.set('rb_unread', 0); updBadge(); }
  RENDER[t]();
  window.scrollTo(0, t === 'ai' ? document.body.scrollHeight : 0);
}
let dirtyT = null, lastPaint = 0;
function dirty() {
  if (dirtyT) return;
  const wait = Math.max(0, 1000 - (Date.now() - lastPaint));
  dirtyT = setTimeout(() => {
    dirtyT = null; lastPaint = Date.now();
    if (document.hidden) return;
    // no repintamos mientras escribes ni en el asistente (para no perder el texto)
    const a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && $('main').contains(a)) return;
    if (ST.tab === 'ai') return;
    if (ST.tab === 'liq' && ST.ui.liqView === 'map') return;
    RENDER[ST.tab]();
  }, wait);
}

document.addEventListener('click', e => {
  const tb = e.target.closest('#tabbar button');
  if (tb) { setTab(tb.dataset.tab); return; }
  if (e.target === $('sheet')) { closeSheet(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const d = el.dataset, u = ST.ui;
  switch (d.act) {
    case 'settings': openSettings(); break;
    case 'close': closeSheet(); break;
    case 'tab': if (d.sub) u.whaleView = d.sub; closeSheet(); setTab(d.tab); break;
    case 'coin': openCoin(d.coin); break;
    case 'coinRange': openCoin(d.coin, +d.v); break;
    case 'goLiqMap': u.liqView = 'map'; u.liqCoin = d.coin; closeSheet(); setTab('liq'); break;
    case 'goPos': u.whaleView = 'pos'; u.posCoin = d.coin; closeSheet(); setTab('whales'); break;
    case 'whalePos': u.whaleView = 'pos'; setTab('whales'); break;
    case 'wallet': openWallet(d.addr); break;
    case 'whaleView': u.whaleView = d.v; renderWhales(); break;
    case 'wCoin': u.wCoin = d.v; renderWhales(); break;
    case 'wSide': u.wSide = d.v; renderWhales(); break;
    case 'wMin': u.wMin = +d.v; renderWhales(); break;
    case 'posCoin': u.posCoin = d.v; renderWhales(); break;
    case 'liqView': u.liqView = d.v; renderLiq(); break;
    case 'liqWin': u.liqWin = +d.v; renderLiq(); break;
    case 'liqCoin': u.liqCoin = d.v; renderLiq(); break;
    case 'liqRange': u.liqRange = +d.v; renderLiq(); break;
    case 'thermoHelp': {
      const t = thermo();
      openSheet('Termómetro del mercado', '<p class="small">Junta 8 señales del mercado en una sola nota de 0 (pánico) a 100 (euforia). Cada señal se pasa a la misma escala y se hace la media.</p>' +
        t.parts.map(p => '<div class="card" style="margin:8px 0"><div class="row"><b class="grow">' + p.k + '</b><span class="num" style="font-weight:800;color:' + scoreColor(p.s) + '">' + Math.round(p.s) + '</span></div><div class="small mut">' + esc(p.txt) + '</div><div class="small" style="margin-top:4px">' + p.help + '</div></div>').join('') +
        '<p class="hint">Valores extremos no significan que vaya a subir o bajar: históricamente la euforia extrema suele preceder a correcciones y el pánico a rebotes, pero no siempre.</p>');
      break;
    }
    case 'addWallet': if (follow($('addAddr').value.trim(), $('addName').value)) { $('addAddr').value = ''; $('addName').value = ''; renderWallets(); } break;
    case 'follow': { const n = $('followName'); if (follow(d.addr, n ? n.value : '')) openWallet(d.addr.toLowerCase()); break; }
    case 'unfollow': unfollow(d.addr); openWallet(d.addr); break;
    case 'copy':
      try { navigator.clipboard.writeText(d.v).then(() => toast('Dirección copiada'), () => toast(d.v)); } catch (err) { toast(d.v); }
      break;
    case 'clearAlerts': ST.alerts = []; LS.set('rb_alerts', []); renderWallets(); break;
    case 'notif':
      try { Notification.requestPermission().then(() => renderWallets()); } catch (err) { toast('Tu navegador no permite notificaciones aquí.'); }
      break;
    case 'quick': ask(d.v); break;
    case 'ask': ask($('askin').value); break;
    case 'clearChat': ST.chat = []; LS.set('rb_chat', []); renderAI(); break;
    case 'saveKeyAI': { const k = $('aiKey').value.trim(); if (!k) return; CFG.key = k; toast('Clave guardada'); renderAI(); break; }
    case 'toggleCoin': {
      let cs = CFG.coins.slice();
      const i = cs.indexOf(d.v);
      if (i >= 0) { if (cs.length === 1) return; cs.splice(i, 1); }
      else { if (cs.length >= 8) { toast('Máximo 8 monedas'); return; } cs.push(d.v); }
      cs = ALL_COINS.filter(c => cs.indexOf(c) >= 0);
      CFG.coins = cs;
      el.classList.toggle('on');
      if (cs.indexOf(u.posCoin) < 0) u.posCoin = cs[0];
      if (cs.indexOf(u.liqCoin) < 0) u.liqCoin = cs[0];
      if (u.wCoin !== 'all' && cs.indexOf(u.wCoin) < 0) u.wCoin = 'all';
      wsRestart(); runTask('sparks'); runTask('liqs');
      break;
    }
    case 'setMin':
      CFG.min = +d.v;
      el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el));
      break;
    case 'cardMove': {
      const cs = CFG.cards, i = +d.v, j = i + (+d.d);
      if (j < 0 || j >= cs.length) return;
      const t = cs[i]; cs[i] = cs[j]; cs[j] = t;
      CFG.cards = cs;
      const top = $('sheetBody').scrollTop;
      openSettings();
      $('sheetBody').scrollTop = top;
      break;
    }
    case 'saveSettings':
      CFG.key = $('setKey').value;
      CFG.model = $('setModel').value || 'gemini-flash-latest';
      toast('Guardado'); closeSheet();
      break;
    case 'testKey': {
      CFG.key = $('setKey').value; CFG.model = $('setModel').value || 'gemini-flash-latest';
      if (!CFG.key) { toast('Pega primero la clave'); return; }
      el.disabled = true; el.textContent = 'Probando…';
      gemini([{ role: 'user', parts: [{ text: 'Responde solo: OK' }] }])
        .then(() => toast('La clave funciona ✅'), err => toast(err.message))
        .then(() => { el.disabled = false; el.textContent = 'Probar clave'; });
      break;
    }
    case 'wipe':
      if (!confirm('¿Borrar el historial de ballenas, liquidaciones, avisos y chat? Tus carteras seguidas y ajustes se mantienen.')) return;
      ['rb_wt', 'rb_liq', 'rb_alerts', 'rb_chat'].forEach(LS.del);
      ST.whaleTrades = []; ST.liqs = []; ST.alerts = []; ST.chat = [];
      tradeSeen.clear(); liqSeen.clear();
      toast('Historial borrado'); closeSheet();
      break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'cardOn') { const cs = CFG.cards; cs[+el.dataset.v].on = el.checked; CFG.cards = cs; }
});
$('askin').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask($('askin').value); }
});

/* ---------- planificador: refresca cada fuente a su ritmo ---------- */
const TASKS = {
  ctx: { every: 15e3, fn: loadCtx },
  fng: { every: 15 * 60e3, fn: loadFng },
  stats: { every: 5 * 60e3, fn: loadStats },
  book: { every: 30e3, fn: loadBook },
  liqs: { every: 30e3, fn: loadLiqs },
  sparks: { every: 5 * 60e3, fn: loadSparks },
  whales: { every: 3 * 60e3, fn: loadWhales },
  saved: { every: 45e3, fn: loadSaved }
};
const taskNext = {}, taskBusy = {};
async function runTask(k) {
  if (taskBusy[k]) return;
  taskBusy[k] = true;
  try { await TASKS[k].fn(); } catch (e) { ST.errors[k] = e.message; }
  taskBusy[k] = false;
  taskNext[k] = Date.now() + TASKS[k].every;
  dirty();
}
function tick() {
  if (document.hidden) return;
  const now = Date.now();
  Object.keys(TASKS).forEach(k => { if (!taskNext[k] || now >= taskNext[k]) runTask(k); });
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { wsConnect(); tick(); dirty(); }
});

/* ---------- arranque ---------- */
(function init() {
  if (CFG.coins.indexOf(ST.ui.posCoin) < 0) ST.ui.posCoin = CFG.coins[0];
  if (CFG.coins.indexOf(ST.ui.liqCoin) < 0) ST.ui.liqCoin = CFG.coins[0];
  updBadge();
  setLive();
  setTab('home');
  wsConnect();
  tick();
  setInterval(tick, 5000);
  setInterval(dirty, 20000); // refresca los "hace X min"
})();
</script>
