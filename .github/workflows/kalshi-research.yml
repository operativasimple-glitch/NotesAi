# Mide con datos públicos de Kalshi si la estrategia del bot habría ganado dinero.
# No usa ninguna clave ni envía órdenes: solo lee mercados ya liquidados.
# En repositorios públicos, GitHub Actions es gratis.
name: "Kalshi: ¿gana el bot?"

on:
  workflow_dispatch:
    inputs:
      run:
        description: "Qué medir (separado por comas): live, timing, sports, category, sweep"
        default: live,timing
      sports:
        description: Series de partidos (separadas por comas)
        default: KXNFLGAME,KXMLBGAME,KXNBAGAME,KXNHLGAME,KXNCAAFGAME
      category:
        description: Categoría extra (sus series más negociadas)
        default: Financials
  push:
    branches: [claude/kalshi-bot-kjmcj6]
    paths:
      - .github/workflows/kalshi-research.yml

permissions:
  contents: read

concurrency:
  group: kalshi-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: kalshi-bot
    env:
      KALSHI_ENV: prod
      RUN: ${{ inputs.run || 'live,timing' }}
      SPORTS: ${{ inputs.sports || 'KXNFLGAME,KXMLBGAME,KXNBAGAME,KXNHLGAME,KXNCAAFGAME' }}
      CATEGORY: ${{ inputs.category || 'Financials' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          pip install -r requirements.txt
          printf '[http]\nreads_per_second = 10\n' > config.toml
      - name: Conexión con Kalshi
        run: python -m kalshi_bot check
      - name: Partidos abiertos ahora (cierre y fin previsto)
        if: contains(env.RUN, 'live')
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from kalshi_bot.config import load_settings
          from kalshi_bot.models import parse_time
          client = load_settings().client()
          now = datetime.now(timezone.utc)
          def hours(value):
              t = parse_time(value)
              return f"{(t - now).total_seconds() / 3600:7.1f} h" if t else "      —"
          for series in ("KXMLBGAME", "KXNFLGAME", "KXNHLGAME", "KXNCAAFGAME", "KXNBAGAME"):
              markets = client.get_markets(status="open", series_ticker=series, max_pages=1)
              print(f"{series}: {len(markets)} mercados abiertos")
              for m in sorted(markets, key=lambda m: m.raw.get("expected_expiration_time") or "")[:4]:
                  raw = m.raw
                  print(f"   {m.ticker:<40} cierre en {hours(raw.get('close_time'))} | fin previsto en "
                        f"{hours(raw.get('expected_expiration_time'))} | {m.yes_bid}/{m.yes_ask} | vol24h {m.volume_24h}")
          PY
      - name: ¿Cuándo gana? (por tiempo hasta el final)
        if: contains(env.RUN, 'timing')
        run: |
          python -m kalshi_bot research --series KXMLBGAME,KXNHLGAME,KXNFLGAME,KXNCAAFGAME --markets 200 \
            --pages 8 --by-time --json timing.json | tee timing.txt
      - name: Partidos (ganador)
        if: contains(env.RUN, 'sports')
        run: |
          python -m kalshi_bot research --series "$SPORTS" --markets 800 --json sports.json | tee sports.txt
      - name: Categoría extra (bolsa, etc.)
        if: contains(env.RUN, 'category')
        run: |
          python -m kalshi_bot research --category "$CATEGORY" --top 6 --markets 1500 \
            --json category.json | tee category.txt
      - name: Barrido de series activas
        if: contains(env.RUN, 'sweep')
        run: python -m kalshi_bot research --sweep --series-count 15 --per-series 400 --json sweep.json | tee sweep.txt
      - name: Resumen
        if: always()
        run: |
          set +e
          {
            echo '## ¿Gana el bot?'
            echo '```'
            for f in timing sports category sweep; do [ -f "$f.txt" ] && cat "$f.txt"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for f in timing sports category sweep; do
            if [ -f "$f.json" ]; then echo; echo "=== JSON $f ==="; cat "$f.json"; echo; fi
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kalshi-research
          path: kalshi-bot/*.json
          if-no-files-found: ignore
