# Mide con datos públicos de Kalshi si la estrategia del bot habría ganado dinero.
# No usa ninguna clave ni envía órdenes: solo lee mercados ya liquidados.
# En repositorios públicos, GitHub Actions es gratis. Cada análisis va en su
# propia máquina, en paralelo (cada una tiene su propio límite de peticiones).
name: "Kalshi: ¿gana el bot?"

on:
  workflow_dispatch:
  push:
    branches: [claude/kalshi-bot-kjmcj6]
    paths:
      - .github/workflows/kalshi-research.yml

permissions:
  contents: read

concurrency:
  group: kalshi-research
  cancel-in-progress: true

env:
  KALSHI_ENV: prod

jobs:
  analysis:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Partidos (MLB, NFL, NHL, NBA, universitario)
            args: --series KXMLBGAME,KXNFLGAME,KXNHLGAME,KXNBAGAME,KXNCAAFGAME --markets 800
          - name: Clima Los Ángeles
            args: --series KXHIGHLAX --markets 2000
          - name: Clima Nueva York
            args: --series KXHIGHNY --markets 2000
          - name: Clima Chicago
            args: --series KXHIGHCHI --markets 2000
          - name: Clima Miami
            args: --series KXHIGHMIA --markets 2000
          - name: Clima Austin
            args: --series KXHIGHAUS --markets 2000
          - name: Clima Denver
            args: --series KXHIGHDEN --markets 2000
          - name: Clima Filadelfia
            args: --series KXHIGHPHIL --markets 2000
          - name: Bolsa (S&P 500 y Nasdaq-100)
            args: --series KXINX,KXNASDAQ100,KXINXU,KXNASDAQ100U --markets 2000
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: kalshi-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          pip install -r requirements.txt
          printf '[http]\nreads_per_second = 10\n' > config.toml
      - name: La estrategia del bot
        run: |
          python -m kalshi_bot research ${{ matrix.args }} --json out.json --dump-groups groups.json | tee out.txt
      - name: Resumen
        if: always()
        run: |
          set +e
          { echo "## ${{ matrix.name }}"; echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "=== JSON groups ==="; cat groups.json; echo
          exit 0
